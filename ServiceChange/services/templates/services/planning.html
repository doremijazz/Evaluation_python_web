{% extends "services/base.html" %}

{% block main %}

<h1>Planning des réservations</h1>



<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/locales/fr.global.min.js"></script>

<div class="calendar-filters">
    <p>Filtres : </p>
    <button type="button" onclick="filterCalendar('all')">
        Tout afficher
    </button>

     <button type="button" onclick="filterCalendar('matching')">
        Demandes compatibles
    </button>

    <button type="button" onclick="filterCalendar('other')">
        Autres demandes
    </button>

    <button type="button" onclick="filterCalendar('availability')">
        Disponibilités
    </button>
</div>

<div class="legende">
    <p>Légende : </p>
    <div class="Pourvu"><p>Pourvu</p></div>
    <div class="EnAttente"><p>En attente</p></div>
    <div class="Compatible"><p>Compatible</p></div>
    <div class="Disponible"><p>Disponible</p></div>
</div>

<div id="calendar"></div>

{% if user.is_authenticated %}
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        let currentFilter = "all";

        const calendar = new FullCalendar.Calendar(
            document.getElementById("calendar"),
            {
                locale: "fr",
                initialView: "timeGridWeek",
                firstDay: 1,

                slotMinTime: "07:00:00",
                slotMaxTime: "22:00:00",
                allDaySlot: false,

                headerToolbar: {
                    left: "prev,next today",
                    center: "title",
                    right: "dayGridMonth,timeGridWeek,timeGridDay"
                },

                events: function(fetchInfo, successCallback, failureCallback) {
    fetch("{% url 'services:planning_events' %}")
        .then(response => response.json())
        .then(data => {
            const filtered = data.filter(event => {
    const type = event.extendedProps.type;
    const matching = event.extendedProps.matching;

    if (currentFilter === "all") {
        return true;
    }

                if (currentFilter === "availability") {
                    return type === "availability";
                }

                if (currentFilter === "matching") {
                    return type === "request" && matching === true;
                }

                if (currentFilter === "other") {
                    return type === "request" && matching !== true;
                }

                return false;
            });

            successCallback(filtered);
        })
        .catch(failureCallback);
},

                eventContent: function (info) {
                    const container = document.createElement("div");

                    const title = document.createElement("strong");
                    title.textContent = info.event.title;

                    const time = document.createElement("div");
                    time.textContent = info.timeText;

                    container.append(time, title);

                    return {domNodes: [container]};
                },

                 eventClick: function (info) {
    const reservationId = info.event.extendedProps.reservationId;

    const date = info.event.start.toLocaleDateString("fr-FR", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
    });

    const start = info.event.start.toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
    });

    const end = info.event.end?.toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
    }) || "Non renseignée";
if (info.event.extendedProps.status === "En attente" && info.event.extendedProps.type === "request") {
    const userConfirmed = confirm(
        "Réservation : " + info.event.title +
        "\nDate : " + date +
        "\nCréneau : " + start + " - " + end +
        "\nUtilisateur : " +
        (info.event.extendedProps.username || "") + " / " +
        (info.event.extendedProps.email || "") +
        "\nStatut : " + (info.event.extendedProps.status || "") +
        "\n\nVoulez-vous confirmer cette réservation ?"
    );

    if (userConfirmed) {
        fetch("{% url 'services:confirm_action' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCSRFToken()
            },
            body: JSON.stringify({
                reservation_id: reservationId
            })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert("Réservation confirmée !");

                    info.event.setExtendedProp("status", "confirmed");
                    calendar.refetchEvents();
                } else {
                    alert("Erreur : " + (data.error || "Confirmation impossible"));
                }
            })
            .catch(error => {
                console.error("Erreur réseau :", error);
                alert("Erreur lors de la confirmation.");
            });
    }
} else if (info.event.extendedProps.type === "availability") {
    alert(
        "Disponibilité : " + info.event.title +
        "\n\nCompétences : " +
        (info.event.extendedProps.skills || []).join(", ") +
        "\n\nDate : " + date +
        "\nCréneau : " + start + " - " + end +
        "\n\nUtilisateur : " +
        (info.event.extendedProps.username || "") + " / " +
        (info.event.extendedProps.email || "")
    );
}else{
    alert("Cette demande est déja pourvue")
}
}
            }
        );

        calendar.render();
        window.filterCalendar = function(type) {
    currentFilter = type;
    calendar.refetchEvents();
};
    });
    </script>

{% else %}

    <script>
    document.addEventListener("DOMContentLoaded", function () {

        const calendar = new FullCalendar.Calendar(
            document.getElementById("calendar"),
            {
                locale: "fr",
                initialView: "timeGridWeek",
                firstDay: 1,

                slotMinTime: "07:00:00",
                slotMaxTime: "22:00:00",
                allDaySlot: false,

                headerToolbar: {
                    left: "prev,next today",
                    center: "title",
                    right: "dayGridMonth,timeGridWeek,timeGridDay"
                },

                events: "{% url 'services:planning_events' %}"
            }
        );

        calendar.render();
    });
    </script>

{% endif %}


{% endblock %}
